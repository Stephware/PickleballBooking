  <g transform="translate(489 255) rotate(30)" filter="url(#shade)">
    <rect x="-23" y="138" width="46" height="185" rx="12" fill="url(#handle)" stroke="#aa9b95" stroke-width="5"/>
    <path d="M-23 182H23M-23 195H23M-23 207H23M-23 219H23M-23 232H23M-23 244H23M-23 257H23M-23 270H23M-23 283H23" stroke="#bbb3ad" stroke-opacity=".32" stroke-width="3"/>
    <rect x="-28" y="298" width="56" height="15" rx="5" fill="#282329" stroke="#e2d0ba" stroke-width="3"/>
    <rect x="-31" y="-195" width="62" height="393" rx="30" fill="url(#rim)"/>
    <rect x="-185" y="-223" width="370" height="414" rx="153" fill="url(#rim)" stroke="#cfc0a8" stroke-width="6"/>
    <rect x="-173" y="-212" width="346" height="390" rx="145" fill="url(#face)" stroke="#f8ebd9" stroke-width="3"/>
    <rect x="-168" y="-208" width="336" height="383" rx="141" fill="url(#weave)"/>
    <path d="M-123-174Q-174-80-146 45" stroke="#fff5e5" stroke-opacity=".22" stroke-width="8" fill="none"/>
    <path d="M-90-199Q42-234 113-138" stroke="#e8d6c4" stroke-opacity=".1" stroke-width="4" fill="none"/>
  </g>
  <ellipse cx="310" cy="440" rx="105" ry="32" fill="#140710" opacity=".5" filter="url(#shadow)"/>
  <g transform="translate(309 379)" filter="url(#shade)">
    <circle r="89" fill="url(#ball)" stroke="#ffa500" stroke-width="2"/>
