    </filter>
    <filter id="shade" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="10" dy="18" stdDeviation="16" flood-color="#160b13" flood-opacity=".55"/>
    </filter>
  </defs>
  <path d="M54 502L744 178" fill="none" stroke="#fff6e0" stroke-opacity=".32" stroke-width="9"/>
  <path d="M180 550L820 247" fill="none" stroke="#fff6e0" stroke-opacity=".14" stroke-width="4"/>
