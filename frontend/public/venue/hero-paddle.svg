<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 570" role="img" aria-label="Pickleball paddle and yellow perforated ball">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5df"/><stop offset=".4" stop-color="#d4c1a5"/>
      <stop offset=".78" stop-color="#eee8dd"/><stop offset="1" stop-color="#705b57"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67636a"/><stop offset=".45" stop-color="#343037"/>
      <stop offset="1" stop-color="#16151b"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#151219"/><stop offset=".5" stop-color="#62565a"/>
      <stop offset="1" stop-color="#121015"/>
    </linearGradient>
    <radialGradient id="ball" cx=".31" cy=".25" r=".8">
      <stop offset="0" stop-color="#fffa82"/><stop offset=".28" stop-color="#ffe63b"/>
      <stop offset=".67" stop-color="#ffc400"/><stop offset="1" stop-color="#e98a00"/>
    </radialGradient>
    <radialGradient id="ballshine" cx=".38" cy=".28" r=".78">
      <stop offset="0" stop-color="#fff6aa" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff6aa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="weave" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(32)">
      <path d="M0 0V9M4 0V9" stroke="#aaa0a3" stroke-width=".8" opacity=".26"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
