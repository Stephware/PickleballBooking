      <ellipse cx="21" cy="-1" rx="8" ry="12" transform="rotate(20 21 -1)"/>
      <ellipse cx="65" cy="20" rx="8" ry="11" transform="rotate(-19 65 20)"/>
      <ellipse cx="-12" cy="64" rx="8" ry="11" transform="rotate(31 -12 64)"/>
      <ellipse cx="36" cy="56" rx="8" ry="11" transform="rotate(-20 36 56)"/>
